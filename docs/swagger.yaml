basePath: /api/v1
definitions:
  handlers.ContactCreateRequest:
    properties:
      email:
        type: string
      message:
        type: string
      name:
        type: string
      subject:
        type: string
    required:
    - email
    - message
    - name
    - subject
    type: object
  handlers.ContactMessageResponse:
    properties:
      createdAt:
        type: string
      email:
        type: string
      id:
        type: string
      isRead:
        type: boolean
      message:
        type: string
      name:
        type: string
      subject:
        type: string
    type: object
  handlers.ErrorResponse:
    properties:
      error:
        properties:
          code:
            type: string
          details:
            additionalProperties:
              type: string
            type: object
          message:
            type: string
        type: object
      requestId:
        type: string
    type: object
  handlers.ExperienceCreateRequest:
    properties:
      company:
        type: string
      description:
        type: string
      endDate:
        description: nullable
        type: string
      highlights:
        description: teks bullet
        items:
          type: string
        type: array
      isCurrent:
        type: boolean
      location:
        type: string
      sortOrder:
        type: integer
      startDate:
        description: '"2006-01-02"'
        type: string
      tagIds:
        description: UUID string
        items:
          type: string
        type: array
      title:
        type: string
    required:
    - company
    - startDate
    - title
    type: object
  handlers.ExperienceHighlightResponse:
    properties:
      text:
        type: string
    type: object
  handlers.ExperienceResponse:
    properties:
      company:
        type: string
      description:
        type: string
      endDate:
        description: nullable
        type: string
      highlights:
        items:
          $ref: '#/definitions/handlers.ExperienceHighlightResponse'
        type: array
      id:
        type: string
      isCurrent:
        type: boolean
      location:
        type: string
      sortOrder:
        type: integer
      startDate:
        description: '"2006-01-02"'
        type: string
      tags:
        items:
          $ref: '#/definitions/handlers.TagResponse'
        type: array
      title:
        type: string
    type: object
  handlers.ExperienceUpdateRequest:
    properties:
      company:
        type: string
      description:
        type: string
      endDate:
        description: nullable
        type: string
      highlights:
        description: teks bullet
        items:
          type: string
        type: array
      isCurrent:
        type: boolean
      location:
        type: string
      sortOrder:
        type: integer
      startDate:
        description: '"2006-01-02"'
        type: string
      tagIds:
        description: UUID string
        items:
          type: string
        type: array
      title:
        type: string
    required:
    - company
    - startDate
    - title
    type: object
  handlers.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  handlers.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  handlers.LoginResponse:
    properties:
      expiresIn:
        description: detik
        type: integer
      token:
        type: string
      tokenType:
        type: string
    type: object
  handlers.MeResponse:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        type: string
    type: object
  handlers.MessageResponse:
    properties:
      message:
        type: string
    type: object
  handlers.ProjectCreateRequest:
    properties:
      category:
        type: string
      challenge:
        type: string
      coverImageUrl:
        type: string
      demoUrl:
        type: string
      features:
        description: list text bullet
        items:
          type: string
        type: array
      isFeatured:
        type: boolean
      longDescription:
        description: boleh kosong, tapi idealnya diisi
        type: string
      repoUrl:
        type: string
      results:
        description: array bullet hasil
        items:
          type: string
        type: array
      role:
        type: string
      screenshots:
        description: list URL gambar, sederhana dulu
        items:
          type: string
        type: array
      shortDesc:
        type: string
      slug:
        type: string
      solution:
        type: string
      sortOrder:
        type: integer
      tagIds:
        description: list UUID string
        items:
          type: string
        type: array
      technicalDetails:
        additionalProperties: {}
        description: JSON object
        type: object
      timeline:
        type: string
      title:
        type: string
    required:
    - coverImageUrl
    - shortDesc
    - slug
    - title
    type: object
  handlers.ProjectFeatureResponse:
    properties:
      text:
        type: string
    type: object
  handlers.ProjectResponse:
    properties:
      category:
        type: string
      challenge:
        type: string
      coverImageUrl:
        type: string
      demoUrl:
        type: string
      features:
        items:
          $ref: '#/definitions/handlers.ProjectFeatureResponse'
        type: array
      id:
        type: string
      isFeatured:
        type: boolean
      longDescription:
        type: string
      repoUrl:
        type: string
      results:
        items:
          type: string
        type: array
      role:
        type: string
      screenshots:
        items:
          $ref: '#/definitions/handlers.ProjectScreenshotResponse'
        type: array
      shortDesc:
        type: string
      slug:
        type: string
      solution:
        type: string
      sortOrder:
        type: integer
      tags:
        items:
          $ref: '#/definitions/handlers.TagResponse'
        type: array
      technicalDetails: {}
      timeline:
        type: string
      title:
        type: string
    type: object
  handlers.ProjectScreenshotResponse:
    properties:
      imageUrl:
        type: string
      sortOrder:
        type: integer
    type: object
  handlers.ProjectUpdateRequest:
    properties:
      category:
        type: string
      challenge:
        type: string
      coverImageUrl:
        type: string
      demoUrl:
        type: string
      features:
        description: list text bullet
        items:
          type: string
        type: array
      isFeatured:
        type: boolean
      longDescription:
        description: boleh kosong, tapi idealnya diisi
        type: string
      repoUrl:
        type: string
      results:
        description: array bullet hasil
        items:
          type: string
        type: array
      role:
        type: string
      screenshots:
        description: list URL gambar, sederhana dulu
        items:
          type: string
        type: array
      shortDesc:
        type: string
      slug:
        type: string
      solution:
        type: string
      sortOrder:
        type: integer
      tagIds:
        description: list UUID string
        items:
          type: string
        type: array
      technicalDetails:
        additionalProperties: {}
        description: JSON object
        type: object
      timeline:
        type: string
      title:
        type: string
    required:
    - coverImageUrl
    - shortDesc
    - slug
    - title
    type: object
  handlers.ProjectsListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.ProjectResponse'
        type: array
      meta: {}
    type: object
  handlers.ResetPasswordRequest:
    properties:
      password:
        maxLength: 72
        minLength: 8
        type: string
      token:
        type: string
    required:
    - password
    - token
    type: object
  handlers.TagCreateRequest:
    properties:
      name:
        type: string
      type:
        type: string
    required:
    - name
    - type
    type: object
  handlers.TagResponse:
    properties:
      id:
        type: string
      name:
        type: string
      type:
        type: string
    type: object
  handlers.TagUpdateRequest:
    properties:
      name:
        type: string
      type:
        type: string
    required:
    - name
    - type
    type: object
  handlers.UploadResponse:
    properties:
      contentType:
        type: string
      filename:
        type: string
      size:
        type: integer
      url:
        description: URL siap ditempel ke field seperti `coverImageUrl`.
        type: string
    type: object
  models.DashboardOverviewResponse:
    properties:
      contactMessages:
        properties:
          recentCount:
            type: integer
          total:
            type: integer
          unread:
            type: integer
        type: object
      experiences:
        properties:
          current:
            type: integer
          recentCount:
            type: integer
          total:
            type: integer
        type: object
      projects:
        properties:
          featured:
            type: integer
          recentCount:
            type: integer
          total:
            type: integer
        type: object
      system:
        properties:
          recentDays:
            type: integer
          serverTime:
            type: string
        type: object
    type: object
host: localhost:8080
info:
  contact:
    email: fauzan@pandi.id
    name: Fauzan
  description: API untuk personal portfolio (projects, experiences, contact, dll).
  title: Portfolio Backend API
  version: "1.0"
paths:
  /admin/contact-messages:
    get:
      parameters:
      - description: Search
        in: query
        name: q
        type: string
      - description: Filter read/unread
        in: query
        name: isRead
        type: boolean
      - description: Page
        in: query
        name: page
        type: integer
      - description: Limit
        in: query
        name: limit
        type: integer
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.ContactMessageResponse'
            type: array
      security:
      - BearerAuth: []
      summary: View inbox messages
      tags:
      - admin-contact
  /admin/contact-messages/{id}:
    delete:
      parameters:
      - description: Message ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Delete message
      tags:
      - admin-contact
    get:
      parameters:
      - description: Message ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ContactMessageResponse'
      security:
      - BearerAuth: []
      summary: Get message detail
      tags:
      - admin-contact
  /admin/contact-messages/{id}/read:
    patch:
      parameters:
      - description: Message ID
        in: path
        name: id
        required: true
        type: string
      - description: isRead flag
        in: body
        name: payload
        required: true
        schema:
          additionalProperties:
            type: boolean
          type: object
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Mark contact message read/unread
      tags:
      - admin-contact
  /admin/dashboard/overview:
    get:
      description: Mengembalikan agregat jumlah projects, experiences, dan contact
        messages, termasuk hitungan "recent" dalam 30 hari terakhir (`system.recentDays`).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.DashboardOverviewResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Ringkasan angka dashboard admin
      tags:
      - admin-dashboard
  /admin/experiences:
    get:
      parameters:
      - description: Search
        in: query
        name: q
        type: string
      - description: Page
        in: query
        name: page
        type: integer
      - description: Limit
        in: query
        name: limit
        type: integer
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.ExperienceResponse'
            type: array
      security:
      - BearerAuth: []
      summary: List all experiences
      tags:
      - admin-experiences
    post:
      parameters:
      - description: Experience payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.ExperienceCreateRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.ExperienceResponse'
      security:
      - BearerAuth: []
      summary: Create new experience
      tags:
      - admin-experiences
  /admin/experiences/{id}:
    delete:
      parameters:
      - description: Experience ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Delete experience
      tags:
      - admin-experiences
    get:
      parameters:
      - description: ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ExperienceResponse'
      security:
      - BearerAuth: []
      summary: Get experience detail
      tags:
      - admin-experiences
    put:
      parameters:
      - description: Experience ID
        in: path
        name: id
        required: true
        type: string
      - description: Update payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.ExperienceUpdateRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ExperienceResponse'
      security:
      - BearerAuth: []
      summary: Update experience
      tags:
      - admin-experiences
  /admin/projects:
    get:
      consumes:
      - application/json
      description: Admin-only list with search, pagination, featured filter
      parameters:
      - description: Search keyword
        in: query
        name: q
        type: string
      - description: Filter featured
        in: query
        name: featured
        type: boolean
      - description: Page
        in: query
        name: page
        type: integer
      - description: Limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ProjectsListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List all projects (admin)
      tags:
      - admin-projects
    post:
      consumes:
      - application/json
      parameters:
      - description: Project payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.ProjectCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.ProjectResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create new project
      tags:
      - admin-projects
  /admin/projects/{id}:
    delete:
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete project
      tags:
      - admin-projects
    get:
      consumes:
      - application/json
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ProjectResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get project by ID
      tags:
      - admin-projects
    put:
      consumes:
      - application/json
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: Update payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.ProjectUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ProjectResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update project by ID
      tags:
      - admin-projects
  /admin/tags:
    get:
      parameters:
      - description: Search
        in: query
        name: q
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: limit
        type: integer
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.TagResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List tags
      tags:
      - admin-tags
    post:
      parameters:
      - description: Tag payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.TagCreateRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.TagResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create new tag
      tags:
      - admin-tags
  /admin/tags/{id}:
    delete:
      parameters:
      - description: Tag ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Delete tag
      tags:
      - admin-tags
    get:
      parameters:
      - description: Tag ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.TagResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get single tag
      tags:
      - admin-tags
    put:
      parameters:
      - description: Tag ID
        in: path
        name: id
        required: true
        type: string
      - description: Tag payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.TagUpdateRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.TagResponse'
      security:
      - BearerAuth: []
      summary: Update tag
      tags:
      - admin-tags
  /admin/uploads:
    post:
      consumes:
      - multipart/form-data
      description: 'Menerima satu berkas lewat multipart form field `file`, lalu mengembalikan
        URL publiknya untuk ditempel ke field seperti `coverImageUrl`. Jenis berkas
        ditentukan dari ISI berkas, bukan dari header Content-Type kiriman klien.
        Yang diizinkan: JPEG, PNG, WebP, GIF, dan PDF — SVG sengaja ditolak karena
        bisa memuat skrip.'
      parameters:
      - description: Berkas yang diunggah
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.UploadResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Unggah berkas (gambar proyek / CV)
      tags:
      - admin-uploads
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Mengirim tautan reset ke email bila terdaftar. Response SELALU
        sama (`200`) baik email terdaftar maupun tidak, untuk mencegah user enumeration.
        Rate-limited.
      parameters:
      - description: Email akun
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Minta tautan reset password
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate admin and return JWT token. Selain body JSON, server
        juga men-set cookie HttpOnly `access_token` (atribut SameSite/Secure/Domain
        mengikuti konfigurasi deploy) yang dipakai klien browser. API client non-browser
        bisa mengabaikan cookie dan memakai field `token` di body via header Authorization.
      parameters:
      - description: Login data
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Login admin
      tags:
      - auth
  /auth/logout:
    post:
      description: Menghapus cookie HttpOnly `access_token` di sisi browser DAN mencabut
        token saat ini (berdasarkan jti) lewat denylist sehingga token langsung tidak
        berlaku walau belum `exp`. Bersifat PUBLIK (tanpa middleware auth) agar user
        dengan token kedaluwarsa tetap bisa membersihkan cookie; token yang sudah
        invalid/kedaluwarsa cukup diabaikan.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Logout
      tags:
      - auth
  /auth/refresh:
    post:
      description: Validasi token saat ini (via AuthJWT, menerima token dari header
        Authorization ATAU cookie `access_token`) lalu terbitkan token baru (iat/exp
        segar) dengan userId+role yang sama. Juga men-set ulang cookie HttpOnly `access_token`.
        Stateless, tanpa refresh-token store.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LoginResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Refresh JWT token
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: 'Menukar token dari tautan email dengan password baru. Token hanya
