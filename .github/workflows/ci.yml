name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uji:
    name: test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Membaca direktif `go`/`toolchain` dari go.mod (saat ini toolchain go1.26.11).
          go-version-file: go.mod
          check-latest: true
          cache: true

      # -race: data race adalah kegagalan yang belum sempat terjadi. Sama
      # dengan `make test`.
      - name: Test (race)
        run: go test -race ./...

  periksa:
    name: gerbang rilis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      # Gerbang menolak berjalan tanpa govulncheck (audit yang dilewati harus
      # terlihat), jadi alatnya dipasang dulu.
      - name: Pasang govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # Satu skrip yang sama dengan `make periksa` di laptop: go vet + gofmt,
      # build, pola berbahaya, rahasia di binary, tiap route berpenjaga, dan
      # govulncheck (gagal bila ada kerentanan yang BENAR-BENAR terpanggil).
      - name: Gerbang rilis
        run: bash tools/periksa.sh
